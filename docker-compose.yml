services:
  # Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: ptms_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - ptms_network

  # Application (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptms_app
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-PTMS}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ptms}"
      DB_USERNAME: "${DB_USERNAME:-ptms_user}"
      DB_PASSWORD: "${DB_PASSWORD:-ptms_password}"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ptms_network

  # Database (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: ptms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ptms}"
      MYSQL_USER: "${DB_USERNAME:-ptms_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ptms_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password}"
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - ptms_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ptms_network

volumes:
  ptms_db_data:
    driver: local

networks:
  ptms_network:
    driver: bridge
